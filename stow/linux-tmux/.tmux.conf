# Linux tmux profile. Kept separate from the macOS config and its live link.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g repeat-time 0
set -g renumber-windows on
set -g extended-keys on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

bind-key '\\' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
unbind-key -n p
unbind-key -n n
bind-key p switch-client -p
bind-key n switch-client -n

set -g mouse on
set -g history-limit 20000
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind o run-shell -b 'dotfiles-open "#{pane_current_path}"'
bind -r e kill-pane -a
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'dotfiles-copy'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind s choose-session
bind m choose-session
set -g status on
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
unbind -n C-f
bind -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind -n C-[ copy-mode

bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

set -g status-style bg=default,fg=default
set -g status-left-length 30
set -g status-left " [#[bold]#S]    #[fg=#24283b,nounderscore]"
setw -g window-status-format "#[fg=#bbbbbb] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bold] [*#I:#W*]   #[default]"
set -g status-right-length 40
set -g status-right "#[fg=#ffffff](#W:#{window_index}) #[fg=#bbbbbb]| #[fg=#ffffff]%Y-%m-%d %H:%M"
set -g pane-border-style fg=#24283b
set -g pane-active-border-style fg=#ffffff
set -g message-style bg=#24283b,fg=#ffffff

set -g @plugin 'tmux-plugins/tmux-sensible'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'
